ddi_compact_density:
  type: bool
  default: true
  description: "Use compact dashboard spacing density"

ddi_red_glow_strength:
  type: enum
  default: medium
  choices:
    - low
    - medium
    - high
  description: "Controls ambient red glow intensity"

ddi_homepage_dashboard_enabled:
  type: bool
  default: true
  description: "Show the Intelligence Dashboard (archive statistics: total documents, departments, document types, classification levels, recently updated) above the page content — disable if it doesn't suit a given route configuration"

ddi_sidebar_command_panel_enabled:
  type: bool
  default: true
  description: "Enable command-panel sidebar presentation"

ddi_footer_enabled:
  type: bool
  default: true
  description: "Enable DDI corporate command footer"

ddi_debug_mode_enabled:
  type: bool
  default: false
  description: "Show a diagnostic metadata panel on topic pages (document ID, classification, tags, word count, etc.) — off by default, admin/staging use only"

ddi_intelligence_index_enabled:
  type: bool
  default: true
  description: "Show the alphabetical Intelligence Index of every archived document above the page content (hidden on document and admin pages) — disable if it doesn't suit a given route configuration"

ddi_integrity_dashboard_enabled:
  type: bool
  default: true
  description: "Show the staff-only Document Integrity Dashboard trigger (metadata gaps, duplicate document numbers, invalid cross references, broken related-document links) — staff/admin only regardless of this setting"

ddi_system_status_enabled:
  type: bool
  default: true
  description: "Show the staff-only DDI System Status trigger (archive health summary cards, linking into the Integrity Dashboard where applicable) — staff/admin only regardless of this setting"

ddi_timeline_view_enabled:
  type: bool
  default: true
  description: "Show the Intelligence Timeline (documents grouped by year, most recent first, expand/collapse per year) above the page content — disable if it doesn't suit a given route configuration"

ddi_knowledge_graph_viewer_enabled:
  type: bool
  default: true
  description: "Show the interactive Knowledge Graph Viewer (parent/child/cross-reference/related documents, pan and zoom) below the first post on a document page"
