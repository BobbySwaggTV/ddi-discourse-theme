ddi_compact_density:
  type: bool
  default: true
  description: "Use compact dashboard spacing density"

ddi_red_glow_strength:
  type: enum
  default: medium
  choices:
    - low
    - medium
    - high
  description: "Controls ambient red glow intensity"

ddi_homepage_dashboard_enabled:
  type: bool
  default: true
  description: "Show the Intelligence Dashboard (archive statistics: total documents, departments, document types, classification levels, recently updated) above the page content — disable if it doesn't suit a given route configuration"

ddi_sidebar_command_panel_enabled:
  type: bool
  default: true
  description: "Enable command-panel sidebar presentation"

ddi_footer_enabled:
  type: bool
  default: true
  description: "Enable DDI corporate command footer"

ddi_debug_mode_enabled:
  type: bool
  default: false
  description: "Show a diagnostic metadata panel on topic pages (document ID, classification, tags, word count, etc.) — off by default, admin/staging use only"

ddi_intelligence_index_enabled:
  type: bool
  default: true
  description: "Enable the \"All Documents\" (alphabetical) tab of the Browse Archive section above the page content (hidden on document and admin pages) — disable if it doesn't suit a given route configuration. If ddi_timeline_view_enabled is also on, both appear as tabs of one section; if this is the only one on, Browse Archive shows just this view with no tab switcher"

ddi_integrity_dashboard_enabled:
  type: bool
  default: true
  description: "Show the staff-only Document Integrity Dashboard trigger (metadata gaps, duplicate document numbers, invalid cross references, broken related-document links) — staff/admin only regardless of this setting"

ddi_system_status_enabled:
  type: bool
  default: true
  description: "Show the staff-only DDI System Status trigger (archive health summary cards, linking into the Integrity Dashboard where applicable) — staff/admin only regardless of this setting"

ddi_timeline_view_enabled:
  type: bool
  default: true
  description: "Enable the \"By Year\" tab of the Browse Archive section (documents grouped by year, most recent first, expand/collapse per year) above the page content — disable if it doesn't suit a given route configuration. If ddi_intelligence_index_enabled is also on, both appear as tabs of one section; if this is the only one on, Browse Archive shows just this view with no tab switcher"

ddi_knowledge_graph_viewer_enabled:
  type: bool
  default: true
  description: "Show the interactive Knowledge Graph Viewer (parent/child/cross-reference/related documents, pan and zoom) below the first post on a document page"

ddi_reading_lists_enabled:
  type: bool
  default: true
  description: "Show the Reading Lists trigger (create reusable, shareable document reading lists stored locally in the browser)"

ddi_document_actions_enabled:
  type: bool
  default: true
  description: "Show the Document Actions bar near the Dossier Header (Add to Reading List, Favorite, Open Knowledge Graph, Share) — individual actions still hide themselves when unavailable regardless of this setting"

ddi_document_author_assistant_enabled:
  type: bool
  default: true
  description: "Show the Document Author Assistant panel in the composer (real-time ✓/⚠ guidance on Document Number, Classification, Department, Document Type, Lifecycle, Executive Summary, H2 Sections, Cross References, Related Documents) while composing a new topic or editing an existing document's first post — never shown for replies"

ddi_homepage_hero_enabled:
  type: bool
  default: true
  description: "Show the cinematic homepage hero (background image, archive title, subtitle, archive statistics, Browse Archive/View Divisions actions) above the Dashboard — homepage only, hidden on /categories and individual division pages, which have their own header treatment"

ddi_hero_background_image:
  type: upload
  default: ""
  description: "Background image for the homepage hero — replace without modifying code by uploading a new image here. Leave empty to show the hero's dark gradient with no photo"

ddi_hero_subtitle:
  type: string
  default: "Six operational divisions. One command network."
  description: "Optional subtitle shown under the homepage hero's title — leave empty to hide it entirely"

ddi_mission_briefing_enabled:
  type: bool
  default: true
  description: "Show the Mission Briefing section directly below the homepage hero (an Executive Command welcome message, DDI's mission statement, all six Operational Divisions as pillar links, and Mission Objectives) — homepage only, same scope as the hero. Independent of ddi_homepage_hero_enabled — either can be on without the other"

ddi_document_intelligence_header_enabled:
  type: bool
  default: true
  description: "Show the standardized Document Intelligence Header above every document (title, Document Number, Classification, Department, Lifecycle, Revision, Last Reviewed, Estimated Reading Time, Related Documents count) — replaces the earlier mid-page Document Intelligence card"

ddi_document_navigation_sidebar_enabled:
  type: bool
  default: true
  description: "Show the live Document Navigation sidebar (auto-built outline of every H2/H3 section, active-section highlighting, smooth-scroll) on documents that have headings — replaces the earlier static Table of Contents card. Hides automatically on documents with no headings"

ddi_intelligence_relationships_enabled:
  type: bool
  default: true
  description: "Show the Intelligence Relationships panel below the Document Intelligence Header (References, Supersedes, Superseded By, Related Intelligence, Required Reading, Supporting Documentation, Same Department, Same Classification, grouped by type) — replaces the earlier separate Document Relationships and Intelligence Network cards. Hides automatically on documents with no relationships in any group"
